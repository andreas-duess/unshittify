<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:J;font-weight:400;src:url(../public/fonts/jbm-400.woff2)}
@font-face{font-family:J;font-weight:700;src:url(../public/fonts/jbm-700.woff2)}
/* Bluesky profile banner, 3:1. Rendered at 2x (3000x1000). The avatar covers
   the bottom-left, so the content sits right of centre. */
*{margin:0;box-sizing:border-box}
html,body{width:1500px;height:500px;background:#0a0b0c;overflow:hidden;font-family:J,monospace}
.grid{position:absolute;inset:0;background-image:linear-gradient(#16191c 1px,transparent 1px),linear-gradient(90deg,#16191c 1px,transparent 1px);background-size:50px 50px;opacity:.55}
.line{position:absolute;left:0;right:0;top:348px;border-top:2px solid #22262b}
.copy{position:absolute;left:560px;top:92px}
.prompt{font-size:22px;color:#868c94}.prompt b{color:#ff6a1a;font-weight:400}
h1{margin-top:18px;font-size:64px;line-height:1.05;font-weight:700;color:#e6e6e2;letter-spacing:-.02em}
.url{position:absolute;left:560px;top:372px;font-size:22px;color:#ff6a1a}
.bot{position:absolute;left:1190px;top:132px;width:258px;height:216px}
svg path,svg rect,svg circle{fill:none;stroke:#e6e6e2;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
svg .thin{stroke-width:1;stroke:#868c94}
svg .eye{fill:#e6e6e2;stroke:none}
svg .acc-fill{fill:#ff6a1a;stroke:none}
svg .acc{stroke:#ff6a1a}
</style></head><body>
<div class="grid"></div>
<div class="line"></div>
<div class="copy">
  <p class="prompt">~/<b>$</b> unshittify --list --all</p>
  <h1>You bought it.<br>Make it yours.</h1>
</div>
<p class="url">[u] unshittify.dev</p>
<svg class="bot" viewBox="0 0 48 40" overflow="visible">
  <path d="M19 7V3.5"/><circle class="acc-fill" cx="19" cy="2.6" r="1.3"/>
  <rect x="13" y="7" width="12" height="9" rx="1"/><circle class="eye" cx="21.5" cy="11.5" r="1.1"/>
  <rect x="12" y="17" width="14" height="11" rx="1"/><path class="thin" d="M15 21h5M15 24h3"/>
  <path d="M13 20l-3.5 5"/>
  <path d="M25 20l6 5"/><path d="M31 25l5 5"/><path d="M35 31.5l2.5-2.5 1.5 1.5-1 1 1 1-2.5 2.5z"/>
  <path class="acc" d="M41 30.5l2.2-1.4M41.5 33.5l2.6.2M40 27.6l1-2.2"/>
  <path d="M16 28v10.5h-2"/><path d="M22 28v10.5h2"/>
</svg>
</body></html>
